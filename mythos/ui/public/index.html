<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYTHOS</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/init.css" />
  <link rel="stylesheet" href="/css/hud.css" />
  <link rel="stylesheet" href="/css/overlay.css" />
  <link rel="stylesheet" href="/css/widgets.css" />
  <link rel="stylesheet" href="/css/web-widget.css" />
  <link rel="stylesheet" href="/css/voice.css" />
  <link rel="stylesheet" href="/css/compose-bar.css" />
  <link rel="stylesheet" href="/css/confirm.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/setup.css" />
  <link rel="stylesheet" href="/css/status-banner.css" />
  <link rel="stylesheet" href="/css/update-banner.css" />
  <link rel="stylesheet" href="/css/version-badge.css" />
  <link rel="stylesheet" href="/css/mic-settings.css" />
  <link rel="stylesheet" href="/css/voice-picker.css" />
  <link rel="stylesheet" href="/css/security.css" />
  <!-- NOVA view styles — CV byte-identical; the copied views depend on these class names -->
  <link rel="stylesheet" href="/css/goals.css" />
  <link rel="stylesheet" href="/css/kanban.css" />
  <link rel="stylesheet" href="/css/pipeline.css" />
  <link rel="stylesheet" href="/css/memory.css" />
  <link rel="stylesheet" href="/css/engagements.css" />
</head>
<body>
  <!-- JARVIS radial HUD — full-screen, no nav markup (user-directed design,
       deliberate deviation from the spec's sidebar shell; see ROADMAP.md P9) -->
  <canvas id="hud-canvas" role="img" aria-label="MYTHOS neural map"></canvas>
  <canvas id="core-orb" width="300" height="300" role="img" aria-label="MYTHOS core"></canvas>
  <!-- Screen-reader mirror of the canvas node graph (hud-a11y-layer.js) and a
       single live region for ambient entity/voice status (core-orb.js's
       STATE_LINE + compose-bar.js's setCaption) — a canvas gives a screen
       reader nothing on its own. -->
  <div id="hud-a11y-root"></div>
  <div id="hud-status-live" class="sr-only" aria-live="polite"></div>
  <div id="widget-root"></div>
  <div id="overlay-root"></div>
  <div id="confirm-root"></div>
  <!-- MYTHOS_AUTH_TOKEN prompt, for a REMOTE browser only. Stays empty unless
       GET /health reports authRequired AND GET /api/status answers 401 — a
       default loopback install never paints anything here, and the desktop
       app is signed in by its main process before the page loads. -->
  <div id="auth-root"></div>
  <!-- First-run setup: lists what this machine is still missing (keys, models,
       binaries) and stores keys through the encrypted desktop key store. Sits
       BELOW #auth-root, because its own status call is behind the token gate. -->
  <div id="setup-root"></div>
  <!-- Persistent condition strip: says out loud when the socket has stopped
       reconnecting or an /api call came back 401, both of which were
       previously silent. -->
  <div id="status-banner-root"></div>
  <!-- Which build is this. Stays empty until /api/status answers; see
       js/version-badge.js for why the version number alone is not enough. -->
  <div id="version-badge" hidden></div>
  <!-- Compose bar — multimodal input surface (text + voice). Replaces the bare mic ring. -->
  <div id="compose-bar" role="search" aria-label="MYTHOS input"></div>
  <!-- Legacy mic indicator — kept hidden for backward compat; compose bar renders its own voice button -->
  <div id="mic-indicator" class="mic-idle" style="display:none" title="Say 'Mythos, ...' — click to enable voice"></div>
  <!-- Debug-only live preview: shows the raw camera feed + top-1 gesture
       guess so gesture detection can be visually confirmed during testing.
       Hidden unless the camera is actively watching. -->
  <div id="camera-preview" class="cam-preview-hidden">
    <div id="camera-preview-video"></div>
    <div id="camera-preview-label">no hand</div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
