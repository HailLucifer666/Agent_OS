<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYTHOS</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/init.css" />
  <link rel="stylesheet" href="/css/hud.css" />
  <link rel="stylesheet" href="/css/overlay.css" />
  <link rel="stylesheet" href="/css/widgets.css" />
  <link rel="stylesheet" href="/css/web-widget.css" />
  <link rel="stylesheet" href="/css/voice.css" />
  <link rel="stylesheet" href="/css/compose-bar.css" />
  <link rel="stylesheet" href="/css/confirm.css" />
  <!-- NOVA view styles — CV byte-identical; the copied views depend on these class names -->
  <link rel="stylesheet" href="/css/goals.css" />
  <link rel="stylesheet" href="/css/kanban.css" />
  <link rel="stylesheet" href="/css/pipeline.css" />
  <link rel="stylesheet" href="/css/memory.css" />
  <link rel="stylesheet" href="/css/engagements.css" />
</head>
<body>
  <!-- JARVIS radial HUD — full-screen, no nav markup (user-directed design,
       deliberate deviation from the spec's sidebar shell; see ROADMAP.md P9) -->
  <canvas id="hud-canvas"></canvas>
  <canvas id="core-orb" width="300" height="300" aria-label="MYTHOS core"></canvas>
  <div id="widget-root"></div>
  <div id="overlay-root"></div>
  <div id="confirm-root"></div>
  <!-- Compose bar — multimodal input surface (text + voice). Replaces the bare mic ring. -->
  <div id="compose-bar" role="search" aria-label="MYTHOS input"></div>
  <!-- Legacy mic indicator — kept hidden for backward compat; compose bar renders its own voice button -->
  <div id="mic-indicator" class="mic-idle" style="display:none" title="Say 'Mythos, ...' — click to enable voice"></div>
  <!-- Debug-only live preview: shows the raw camera feed + top-1 gesture
       guess so gesture detection can be visually confirmed during testing.
       Hidden unless the camera is actively watching. -->
  <div id="camera-preview" class="cam-preview-hidden">
    <div id="camera-preview-video"></div>
    <div id="camera-preview-label">no hand</div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
