name: ci
# MANUAL ONLY, on the operator's instruction 2026-09-02: this is a personal
# account with a 2,000-minute free Actions allowance, and CI is to be run
# deliberately at the end of a batch of work rather than on every push and PR.
#
# THE ARITHMETIC THAT PROMPTED IT, measured from `gh run list` durations rather
# than estimated. This job is `runs-on: windows-latest`, and **Windows minutes
# bill at 2x** the Linux rate, so a green run of ~14 minutes wall-clock costs
# ~28 minutes of the allowance. The 200 most recent runs (the API's page cap, so
# this is a FLOOR and not the total) came to ~484 wall-clock minutes — about
# **969 of the 2,000 already spent**, leaving roughly 36 full runs.
#
# Worse, the two triggers this replaced billed a merged PR TWICE: once for
# `pull_request` and again for `push: main` on the merge commit — the same
# commits, ~56 billed minutes per PR, ~18 PRs of headroom.
#
# WHAT STILL GATES A COMMIT. `.githooks/pre-commit` runs the full recursive suite
# on every commit and blocks on any failure — that is where this repo's real gate
# has always lived. Since 2026-09-07 the documentation gates (`sync-test-count
# --check`, `lint-bug-registry`, `build-index --check`, `build-capability-map
# --check`) are `npm run docs:check` in mythos/, run before a push, and the count
# check still runs here. What is deferred is only the
# clean-room check: a fresh checkout, on the pinned Node 22 (dev runs 26), with
# no gitignored fixtures or local vault. That difference is real and has caught
# three defects before — see BUG-399 — so run this before any release.
#
# HOW TO RUN IT: Actions -> ci -> "Run workflow", or `gh workflow run ci.yml`.
# TO RESTORE the automatic triggers, uncomment the two lines below. Prefer
# restoring `pull_request` ALONE — `push: main` is the duplicate half.
on:
  workflow_dispatch:
  # push: { branches: [main] }
  # pull_request: { branches: [main] }
jobs:
  test:
    runs-on: windows-latest
    defaults: { run: { working-directory: mythos } }
    steps:
      # Full history, not the default shallow clone: test/build-release-notes
      # runs collectCommitLog() against this repo's REAL git history, and a
      # fetch-depth:1 checkout makes those tests fail on CI while passing on
      # every dev machine (found 2026-08-16 via the annotation channel).
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Root deps too, not just mythos/: test/electron-builder-files-allowlist
      # requires app-builder-lib, a ROOT devDependency (electron-builder) —
      # with only mythos/node_modules present every build.files test fails on
      # CI and passes locally (same e2e-job precedent: root first).
      - run: npm ci
        working-directory: .
      - run: npm ci
      - name: Run test suite + verify test-count docs are in sync (baseline 0 known failures)
        shell: pwsh
        run: |
          # No path args: node's own recursive discovery, not a shallow test/*.test.js
          # glob (which silently skipped 14 files one level deeper — found 2026-07-30).
          node --test --test-reporter=tap 2>&1 | Tee-Object -Variable out
          $failLine = $out | Select-String -Pattern '^# fail (\d+)' | Select-Object -Last 1
          $fails = if ($failLine) { [int]$failLine.Matches[0].Groups[1].Value } else { 999 }
          $cancelLine = $out | Select-String -Pattern '^# cancelled (\d+)' | Select-Object -Last 1
          $cancelled = if ($cancelLine) { [int]$cancelLine.Matches[0].Groups[1].Value } else { 0 }
          Write-Host "fail count: $fails (baseline allows 0); cancelled: $cancelled"
          # BUG-258/259 lesson (2026-08-13..16): CI sat red for three days with
          # only "exit code 1" to show for it, because nothing surfaced WHICH
          # tests failed into a place readable without log access. `::error::`
          # lines become check-run annotations, which ARE readable via the
          # public API — name the failures where they can be seen.
          if ($fails -gt 0 -or $cancelled -gt 0) {
            # Indented 'not ok' lines are SUBTESTS — the parent alone hid which
            # subtest actually failed on the first round of this diagnostics.
            $bad = $out | Select-String -Pattern '^\s*not ok ' | Select-Object -First 6
            foreach ($line in $bad) { Write-Host ("::error::" + $line.Line.Trim()) }
            # ...and the TAP diagnostic error lines say WHY (assert messages),
            # which the titles alone never showed.
            $errs = $out | Select-String -Pattern '^\s+error: ' | Select-Object -First 6
            foreach ($line in $errs) { Write-Host ("::error::" + $line.Line.Trim()) }
            if (-not $bad -or $bad.Count -eq 0) { Write-Host "::error:: summary reported failures/cancellations but no 'not ok' lines matched" }
          }
          if ($fails -gt 0 -or $cancelled -gt 0) { exit 1 }
          $out | node scripts/sync-test-count.js --check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error:: sync-test-count --check failed — the counts above do not match the committed README/ROADMAP numbers"
            exit 1
          }

  # Separate job on purpose: the unit baseline must stay readable even when a
  # real boot is flaky. A green `node --test` cannot tell you the app STARTS —
  # a slice once shipped with 2598 passing tests and an Electron shell that died
  # before app.ready, and BUG-133 (malformed body answered 500) sat behind 2979
  # passing tests because nothing sent a bad body over real HTTP.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Root deps provide electron for the shell phase; mythos deps provide the server.
      - run: npm ci
      - run: npm ci
        working-directory: mythos
      - name: Install Chromium for the HUD phase
        working-directory: mythos
        run: node node_modules/playwright-core/cli.js install chromium
      - name: E2E — boot, HTTP surface, WebSocket, HUD, Electron shell
        working-directory: mythos
        # --strict fails the job on an involuntary skip, so a runner missing a
        # browser or electron reports red instead of green-having-checked-nothing.
        # If one phase turns out to be flaky here, add --skip-ui or --skip-electron
        # (an explicitly requested skip stays a skip) — never drop --strict.
        run: npm run e2e -- --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: mythos/scripts/e2e/artifacts/
          retention-days: 14
