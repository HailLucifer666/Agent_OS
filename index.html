<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYTHOS — Capability Map &amp; Ticket Register</title>
<style>
  :root{
    --bg:#04060a; --bg2:#070b11; --grid:rgba(55,224,208,.05);
    --ink:#dce7f0; --dim:#68798b; --dimmer:#3a4650;
    --accent:#37e0d0; --accent-soft:rgba(55,224,208,.16);
    --ok:#3ddc97; --warn:#f2b23c; --fail:#ff5a61; --dark:#4a5763; --unknown:#8a7cf0;
    --panel:rgba(8,13,19,.86); --line:rgba(120,150,170,.14);
    --mono:"JetBrains Mono","Cascadia Code",ui-monospace,SFMono-Regular,Consolas,monospace;
    --sans:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1100px 700px at 22% 14%, rgba(55,224,208,.07), transparent 62%),
      radial-gradient(900px 620px at 82% 82%, rgba(120,90,255,.06), transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 60%);
    color:var(--ink); font-family:var(--sans);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:64px 64px; mask-image:radial-gradient(1000px 700px at 50% 45%,#000 30%,transparent 88%);
  }
  /* a canvas is a replaced element: inset:0 alone leaves it at its intrinsic
     300x150, so the width/height here are load-bearing, not decoration. */
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}

  /* ---- masthead ---- */
  header{
    position:fixed; z-index:4; top:0; left:0; right:0; padding:22px 26px;
    display:flex; gap:26px; align-items:flex-start; justify-content:space-between;
    pointer-events:none;
  }
  .brand{pointer-events:auto}
  .brand h1{
    margin:0; font-size:clamp(19px,2.3vw,30px); font-weight:600; letter-spacing:.24em;
    text-transform:uppercase; line-height:1;
  }
  .brand h1 b{color:var(--accent);font-weight:600}
  .brand .sub{
    margin-top:9px; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--dim);
  }
  .brand .sub i{color:var(--accent);font-style:normal}

  .vitals{display:flex;gap:0;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  .vital{
    padding:0 16px; border-left:1px solid var(--line); text-align:right; min-width:82px;
  }
  .vital .n{font-family:var(--mono);font-size:19px;letter-spacing:-.02em;line-height:1.15}
  .vital .l{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px}
  .vital.ok .n{color:var(--ok)} .vital.fail .n{color:var(--fail)} .vital.warn .n{color:var(--warn)}
  .vital.unknown .n{color:var(--unknown)} .vital.dim .n{color:var(--dim)}

  /* ---- view switcher + ticket register (one file, two views) ---- */
  .tabs{display:flex;gap:2px;pointer-events:auto;margin-top:10px}
  .tab{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:none;border:1px solid var(--line);color:var(--dim);padding:5px 13px;
    cursor:pointer;border-radius:2px;
  }
  .tab[aria-selected="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  #register{
    position:fixed;inset:0;z-index:5;overflow:auto;padding:132px 26px 80px;
    background:linear-gradient(180deg,var(--bg2),var(--bg) 40%);
  }
  #register[hidden]{display:none}
  .reg-wrap{max-width:1180px;margin:0 auto}
  .reg-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .reg-search{
    font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.03);
    border:1px solid var(--line);color:var(--ink);padding:7px 11px;border-radius:2px;min-width:230px;
  }
  .reg-search::placeholder{color:var(--dim)}
  .fchip{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    background:none;border:1px solid var(--line);color:var(--dim);padding:4px 9px;
    cursor:pointer;border-radius:2px;display:inline-flex;gap:7px;align-items:center;
  }
  .fchip .ct{font-variant-numeric:tabular-nums;opacity:.75}
  .fchip[aria-pressed="false"]{opacity:.38}
  .fchip .sw{width:8px;height:8px;border-radius:2px;display:inline-block}

  .reg-tablewrap{overflow-x:auto}
  /* Linear-style issue list: a group per status, one line per ticket. */
  .reg-group{margin-bottom:26px}
  .reg-ghead{
    display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:4px;
    background:rgba(255,255,255,.028);margin-bottom:2px;
  }
  .reg-gdot{width:9px;height:9px;border-radius:50%;flex:none}
  .reg-gname{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .reg-gcount{
    font-family:var(--mono);font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums;background:rgba(255,255,255,.05);
    padding:1px 7px;border-radius:9px;
  }
  .reg-gnote{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right;max-width:46ch}

  .reg-row{
    display:flex;align-items:center;gap:12px;padding:8px 12px;
    border-bottom:1px solid rgba(255,255,255,.04);cursor:default;
  }
  .reg-row{cursor:pointer}
  .reg-row:hover{background:rgba(255,255,255,.032)}
  .reg-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .reg-row[aria-current="true"]{background:rgba(55,224,208,.10)}

  /* ticket detail — same shell as the node panel, its own content */
  #tpanel{z-index:7}
  .tp-kv{display:flex;flex-direction:column;gap:16px}
  .tp-sec .lbl{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin-bottom:6px;
  }
  .tp-sec p{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink)}
  .tp-sec code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.05);padding:1px 4px;border-radius:2px}
  .tp-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tp-src{
    margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.6;
  }
  .reg-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .reg-key{
    font-family:var(--mono);font-size:11.5px;color:var(--dim);
    width:5.4rem;flex:none;font-variant-numeric:tabular-nums;
  }
  .reg-name{
    font-size:13.5px;color:var(--ink);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .reg-tags{display:flex;gap:6px;flex:none}
  .reg-tag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap;
  }
  .reg-tag.node{color:var(--accent);border-color:rgba(55,224,208,.35)}
  @media (max-width:720px){
    #register{padding:158px 14px 60px}
    .reg-gnote,.reg-tags{display:none}
    .reg-name{white-space:normal}
  }
  .vital .stamp{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--dim);opacity:.7;margin-top:2px}

  /* ---- legend / filters ---- */
  .legend{
    position:fixed; z-index:4; left:26px; bottom:24px; display:flex; flex-direction:column; gap:7px;
  }
  .legend .cap{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);margin-bottom:2px}
  .legend select{max-width:min(270px,80vw);padding:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font:12px var(--mono)}
  .chip{
    display:flex;align-items:center;gap:9px;background:transparent;border:0;padding:4px 2px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);cursor:pointer;
    text-align:left;transition:color .18s;
  }
  .chip:hover,.chip[aria-pressed="true"]{color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;transition:opacity .18s}
  .chip[aria-pressed="false"] .dot{opacity:.22;box-shadow:none}
  .chip .ct{margin-left:auto;color:var(--dimmer);padding-left:10px}
  .chip.s-ok .dot{background:var(--ok);color:var(--ok)}
  .chip.s-warn .dot{background:var(--warn);color:var(--warn)}
  .chip.s-fail .dot{background:var(--fail);color:var(--fail)}
  .chip.s-dark .dot{background:var(--dark);color:var(--dark)}
  .chip.s-unknown .dot{background:var(--unknown);color:var(--unknown)}

  .hint{
    position:fixed;z-index:4;right:26px;bottom:24px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);text-align:right;line-height:1.9;
  }
  .hint kbd{font:inherit;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 5px}

  /* ---- detail panel ---- */
  .panel{
    position:fixed;z-index:5;top:0;right:0;height:100%;width:min(392px,90vw);
    background:var(--panel);backdrop-filter:blur(18px);
    border-left:1px solid var(--line);
    transform:translateX(101%);transition:transform .42s cubic-bezier(.22,.9,.24,1);
    display:flex;flex-direction:column;
  }
  .panel[data-open="false"]{visibility:hidden}
  .panel[data-open="true"]{transform:none;visibility:visible}
  .panel .top{padding:24px 24px 18px;border-bottom:1px solid var(--line)}
  .panel .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .panel h2{margin:10px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .panel .verdict{
    margin-top:14px;display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid currentColor;border-radius:999px;padding:5px 12px;
  }
  .panel .body{padding:20px 24px 30px;overflow:auto;flex:1}
  .metric{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
  .metric div{flex:1;padding:12px 14px;border-right:1px solid var(--line)}
  .metric div:last-child{border-right:0}
  .metric .v{font-family:var(--mono);font-size:17px;line-height:1.1}
  .metric .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-top:5px}
  .metric .v.ok{color:var(--ok)} .metric .v.fail{color:var(--fail)}
  .bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin:-8px 0 20px}
  .bar i{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.22,.9,.24,1)}
  .scope{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dimmer);margin:-12px 0 18px}
  .panel p{margin:0 0 15px;font-size:13.5px;line-height:1.68;color:#b9c8d5}
  .panel .ev{
    font-family:var(--mono);font-size:11px;line-height:1.7;color:#8ea3b4;
    border-left:2px solid var(--accent-soft);padding:2px 0 2px 13px;margin:0 0 16px;
    white-space:pre-wrap;word-break:break-word;
  }
  .panel .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer);margin:0 0 8px}
  .panel .links{display:flex;flex-wrap:wrap;gap:6px}
  .panel .links span{
    font-family:var(--mono);font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;
  }
  .close{
    position:absolute;top:20px;right:20px;width:28px;height:28px;border-radius:50%;
    background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer;
    font-family:var(--mono);font-size:13px;line-height:1;display:grid;place-items:center;
  }
  .close:hover{color:var(--ink);border-color:var(--dim)}

  .tip{
    position:fixed;z-index:6;pointer-events:none;opacity:0;transition:opacity .14s;
    background:rgba(4,7,11,.92);border:1px solid var(--line);border-radius:5px;
    padding:6px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;white-space:nowrap;
  }
  .tip[data-on="true"]{opacity:1}
  .tip b{font-weight:500}

  @media (max-width:820px){
    header{flex-direction:column;gap:16px;padding:16px}
    .vitals{justify-content:flex-start}
    .vital:first-child{border-left:0;padding-left:0}
    .panel{width:100%;height:64%;top:auto;bottom:0;border-left:0;border-top:1px solid var(--line);
      transform:translateY(101%)}
    .legend{bottom:12px;left:14px} .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>

<canvas id="stage" role="img" aria-label="Capability relationships. Use the Choose a capability control to read every node's evidence."></canvas>

<header>
  <div class="brand">
    <h1>MY<b>THOS</b> &middot; CAPABILITY MAP</h1>
    <div class="sub" id="hdr-sub"></div>
    <div class="tabs" role="tablist" aria-label="View">
      <button class="tab" id="tab-map" role="tab" aria-selected="true" aria-controls="stage">Capability map</button>
      <button class="tab" id="tab-reg" role="tab" aria-selected="false" aria-controls="register">Ticket register</button>
    </div>
  </div>
  <div class="vitals" id="hdr-vitals"></div>
</header>

<div class="legend" id="legend">
  <label class="cap" for="node-choice">Choose a capability</label>
  <select id="node-choice"><option value="">Select for evidence</option></select>
  <div class="cap">status filter</div>
</div>

<div class="hint" id="hint">
  click a node for evidence<br>
  <kbd>drag</kbd> to pan &nbsp; <kbd>scroll</kbd> to zoom
</div>

<aside class="panel" id="panel" data-open="false" aria-live="polite" inert>
  <div class="top">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <div class="kicker" id="p-cluster">—</div>
    <h2 id="p-name">—</h2>
    <div class="verdict" id="p-verdict">—</div>
  </div>
  <div class="body">
    <div class="metric" id="p-metric"></div>
    <div class="bar" id="p-bar"><i></i></div>
    <div class="scope" id="p-scope">all-time, across 29 vault days &mdash; recent behaviour is in the note below</div>
    <p id="p-note"></p>
    <div class="lbl">evidence</div>
    <div class="ev" id="p-ev"></div>
    <div class="lbl" id="p-links-lbl">connected to</div>
    <div class="links" id="p-links"></div>
  </div>
</aside>

<div class="tip" id="tip"></div>

<aside class="panel" id="tpanel" data-open="false" aria-live="polite" inert>
  <div class="top">
    <button class="close" id="tclose" aria-label="Close">&times;</button>
    <div class="kicker" id="t-key">—</div>
    <h2 id="t-title">—</h2>
    <div class="verdict" id="t-state">—</div>
    <div class="tp-meta" id="t-meta"></div>
  </div>
  <div class="body">
    <div class="tp-kv" id="t-body"></div>
    <div class="tp-src" id="t-src"></div>
  </div>
</aside>

<section id="register" hidden aria-labelledby="tab-reg">
  <div class="reg-wrap">
    <div class="reg-note" id="reg-note"></div>
    <div class="reg-tools">
      <input class="reg-search" id="reg-search" type="search" placeholder="filter by number or text" aria-label="Filter tickets">
      <span id="reg-filters"></span>
    </div>
    <div id="reg-groups"></div>
    <div class="reg-empty" id="reg-empty" hidden>Nothing matches that filter.</div>
  </div>
</section>

      "ev": "DISPOSITION 2026-08-28 (Track C-1, BUG-385). The node was labelled fail, and that described an EPISODE — a Google CAPTCHA ending a browsing run — not a broken capability. The tool works: 1 recorded call, 1 ok, 0 fail, and it deliberately returns ok even when blocked, with the code saying why: \"blocked, not failed: nothing went wrong, we have simply reached the line this system does not cross\". The handover wording, the tier and a source assertion that no solver service is ever added were all already pinned by browser-obstacles.test.js. That is a complete disposition and it predates this ticket. WHAT WAS NOT RIGHT was what counts as a challenge. CAPTCHA_MARKERS carried bare `cloudflare` and bare `security check`, and looksLikeCaptcha is fed the aria tree PLUS page.url(). Measured against the real function: 6 of 6 ordinary pages flagged — developers.cloudflare.com, a footer reading \"Performance and security by Cloudflare\", a news article about a Cloudflare outage, cloudflarestatus.com, Google account Security Checkup, and a bank help page saying \"we run a security check on every login\". The same run MISSED \"Verifying you are human\" (the marker was \"verify you are human\" and includes() is a substring test), \"Checking your browser before accessing\", the cdn-cgi/challenge-platform path, and \"Press and hold to confirm you are a human\". So the two broad markers did the OPPOSITE of their job: they fired on the brand name, which is on a large fraction of the web, and missed the challenge. This was not cosmetic — browser_snapshot runs the same matcher on EVERY snapshot and attaches \"Do NOT try to solve or bypass it — ask the operator to complete it in the browser window\", so on any Cloudflare-fronted page the model stopped browsing to ask for a challenge that was not there. FIXED mostly by removal: a vendor name is not a marker. Now 0 false positives on 7 ordinary controls and 0 false negatives on 9 challenge shapes, 7 mutations all caught. The sa <script>
"use strict";

var DATA = JSON.parse(document.getElementById("map-data").textContent);
var CORE = DATA.core;
var CLUSTERS = DATA.clusters;
var NODES = DATA.nodes;

/* ============================================================
   LAYOUT + RENDER
   ============================================================ */

var C = {
  ok:  {stroke:"#3ddc97", glow:"rgba(61,220,151,",  label:"verified end to end"},
  warn:{stroke:"#f2b23c", glow:"rgba(242,178,60,",  label:"works, with caveats"},
  fail:{stroke:"#ff5a61", glow:"rgba(255,90,97,",   label:"broken"},
  dark:{stroke:"#4a5763", glow:"rgba(74,87,99,",    label:"never exercised"},
  /* unknown is NOT dark. Dark is a measured zero; unknown is the absence of
     a measurement, and colouring them alike would launder one into the other. */
  unknown:{stroke:"#8a7cf0", glow:"rgba(138,124,240,", label:"not yet measured"}
};
var ACCENT = "#37e0d0";

var cv = document.getElementById("stage");
var ctx = cv.getContext("2d");
var DPR = Math.min(window.devicePixelRatio || 1, 2);

var view = {x:0, y:0, k:1};
var W = 0, H = 0;
var nodes = [], edges = [];
var hover = null, selected = null;
var t0 = performance.now();
var filter = {ok:true, warn:true, fail:true, dark:true, unknown:true};
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function build(){
  nodes = []; edges = [];

  var core = {id:"core", label:CORE.name, s:CORE.status, r:26, tier:0, data:CORE, a:0, dist:0};
  nodes.push(core);

  var byCluster = {};
  CLUSTERS.forEach(function(cl, i){
    var a = (-Math.PI/2) + (i / CLUSTERS.length) * Math.PI * 2;
    var h = {
      id:"h-"+cl.id, label:cl.name, s:cl.status, r:12, tier:1,
      a:a, dist:196,
      data:{cluster:"subsystem", name:cl.name, status:cl.status,
            note:"Cluster hub. Its state is the worst state of the capabilities hanging off it.",
            ev:null}
    };
    byCluster[cl.id] = h;
    nodes.push(h);
    edges.push({a:core, b:h, s:cl.status, w:1.5, trunk:true});
  });

  var groups = {};
  NODES.forEach(function(n){ (groups[n.c] = groups[n.c] || []).push(n); });

  Object.keys(groups).forEach(function(cid){
    var hub = byCluster[cid];
    var list = groups[cid];
    var spread = Math.min(0.86, 0.20 + list.length * 0.095);
    list.forEach(function(n, j){
      var frac = list.length === 1 ? 0.5 : j / (list.length - 1);
      var a = hub.a + (frac - 0.5) * spread;
      var d = hub.dist + 118 + (j % 3) * 46;
      var leaf = {
        id:cid+"-"+j, label:n.n, s:n.s, r:(n.s==="dark"||n.s==="unknown")?5.5:7, tier:2,
        a:a, dist:d,
        data:{cluster:hub.label, name:n.n, status:n.s, ok:n.ok, f:n.f, note:n.note, ev:n.ev, qualification:n.qualification}
      };
      nodes.push(leaf);
      edges.push({a:hub, b:leaf, s:n.s, w:1});
    });
  });

  edges.forEach(function(e){
    e.parts = [];
    var count = (e.s==="dark"||e.s==="unknown") ? 0 : (e.s==="fail" ? 1 : (e.trunk ? 3 : 2));
    for(var i=0;i<count;i++) e.parts.push(Math.random());
  });
}

function place(){
  nodes.forEach(function(n){
    n.x = Math.cos(n.a) * n.dist;
    n.y = Math.sin(n.a) * n.dist * 0.86;
  });
}

function resize(){
  /* measure the element, not the window: the pane can report 0 before layout,
     and a 0-sized backing store silently draws nothing. */
  var r = cv.getBoundingClientRect();
  W = Math.round(r.width)  || window.innerWidth  || 1280;
  H = Math.round(r.height) || window.innerHeight || 720;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  view.k = Math.min(1, Math.min(W/1180, H/860));
  if(W < 820) view.k = Math.max(0.42, Math.min(W/1180, H/900));
}

function visible(n){ return filter[n.s] || n.tier < 2; }

function toScreen(n){
  return { x: W/2 + view.x + n.x * view.k, y: H/2 + view.y + n.y * view.k };
}

function draw(now){
  var t = (now - t0) / 1000;
  if(reduced) t = 0;
  ctx.clearRect(0,0,W,H);

  var core = nodes[0];
  var cs = toScreen(core);

  /* ---- core aura ---- */
  var breathe = 1 + Math.sin(t*1.15) * 0.06;
  var g = ctx.createRadialGradient(cs.x, cs.y, 0, cs.x, cs.y, 250*view.k*breathe);
  g.addColorStop(0, "rgba(55,224,208,.15)");
  g.addColorStop(.45,"rgba(55,224,208,.045)");
  g.addColorStop(1, "rgba(55,224,208,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cs.x, cs.y, 250*view.k*breathe, 0, 6.2832); ctx.fill();

  /* ---- edges ---- */
  edges.forEach(function(e){
    if(!visible(e.b) || !visible(e.a)) return;
    var A = toScreen(e.a), B = toScreen(e.b);
    var col = C[e.s];
    var lit = hover && (hover===e.a || hover===e.b);
    var sel = selected && (selected===e.a || selected===e.b);
    var dim = (hover || selected) && !lit && !sel;

    ctx.save();
    ctx.lineWidth = (e.w + (lit||sel ? 1.1 : 0)) * Math.max(.6, view.k);
    ctx.strokeStyle = col.glow + (dim ? .07 : (lit||sel ? .62 : .2)) + ")";
    if(e.s === "dark"){ ctx.setLineDash([2,7]); }
    else if(e.s === "fail"){ ctx.setLineDash([9,6]); ctx.lineDashOffset = -t*14; }
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.restore();

    /* travelling packets = live traffic */
    if(dim) return;
    var speed = e.s==="ok" ? 0.20 : (e.s==="warn" ? 0.12 : 0.07);
    for(var i=0;i<e.parts.length;i++){
      var p = (e.parts[i] + t*speed) % 1;
      if(e.s === "fail"){
        /* a broken link: the packet reaches ~60% and dies */
        var q = (e.parts[i] + t*speed) % 1;
        if(q > 0.6) continue;
        p = q;
      }
      var px = A.x + (B.x-A.x)*p, py = A.y + (B.y-A.y)*p;
      var fade = e.s==="fail" ? (1 - p/0.6) : (p < .12 ? p/.12 : (p > .88 ? (1-p)/.12 : 1));
      ctx.fillStyle = col.glow + (0.85*fade) + ")";
      ctx.beginPath(); ctx.arc(px, py, (e.trunk?2.1:1.6)*Math.max(.7,view.k), 0, 6.2832); ctx.fill();
    }
  });

  /* ---- nodes ---- */
  for(var i=nodes.length-1;i>=0;i--){
    var n = nodes[i];
    if(!visible(n)) continue;
    var p = toScreen(n);
    var col = C[n.s];
    var lit = hover===n, sel = selected===n;
    var dim = (hover||selected) && !lit && !sel && !(hover&&hover.tier<2&&n.tier===2);
    var pulse = n.s==="fail" ? (0.55 + 0.45*Math.abs(Math.sin(t*3.1 + n.a*3)))
              : n.s==="dark" ? 0.28
              : (0.72 + 0.28*Math.sin(t*1.5 + n.a*2));
    var R = n.r * Math.max(.65, view.k);

    if(n.tier === 0){
      /* the brain: rotating arcs + inner core */
      ctx.save();
      ctx.translate(p.x, p.y);
      for(var k=0;k<3;k++){
        var rr = R*(1.5 + k*0.62);
        ctx.rotate(t*(k%2?0.22:-0.3) + k);
        ctx.lineWidth = 1.1; ctx.strokeStyle = "rgba(55,224,208,"+(0.34-k*0.08)+")";
        ctx.beginPath(); ctx.arc(0,0,rr, 0.4, 0.4+Math.PI*1.15); ctx.stroke();
      }
      ctx.restore();
      var cg = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*1.5);
      cg.addColorStop(0,"#eafffb"); cg.addColorStop(.5,ACCENT); cg.addColorStop(1,"rgba(55,224,208,0)");
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(p.x,p.y,R*1.5,0,6.2832); ctx.fill();
      ctx.fillStyle = "#04060a";
      ctx.beginPath(); ctx.arc(p.x,p.y,R*0.42,0,6.2832); ctx.fill();
    } else {
      ctx.save();
      ctx.globalAlpha = dim ? .28 : 1;
      /* halo */
      ctx.fillStyle = col.glow + (0.16*pulse*(lit||sel?2.2:1)) + ")";
      ctx.beginPath(); ctx.arc(p.x,p.y,R*(lit||sel?3.4:2.5),0,6.2832); ctx.fill();
      /* body */
      ctx.fillStyle = n.s==="dark" ? "#0b1016" : col.stroke;
      ctx.beginPath(); ctx.arc(p.x,p.y,R,0,6.2832); ctx.fill();
      ctx.lineWidth = n.tier===1 ? 2 : 1.4;
      ctx.strokeStyle = col.stroke;
      ctx.globalAlpha = dim ? .3 : (n.s==="dark" ? .8 : 1);
      ctx.stroke();
      if(sel){
        ctx.globalAlpha = .9; ctx.lineWidth = 1;
        ctx.strokeStyle = "#fff";
        ctx.beginPath(); ctx.arc(p.x,p.y,R*2.1 + Math.sin(t*4)*1.5,0,6.2832); ctx.stroke();
      }
      ctx.restore();
    }

    /* labels */
    var showLabel = n.tier<=1 || lit || sel || view.k>0.72;
    if(showLabel){
      ctx.save();
      ctx.globalAlpha = dim ? .22 : (n.tier<=1 ? 1 : (lit||sel ? 1 : .58));
      ctx.font = (n.tier===0 ? "600 12.5px " : n.tier===1 ? "600 11.5px " : "400 10.5px ")
               + '"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace';
      ctx.fillStyle = n.tier<=1 ? "#e6f1f8" : (n.s==="dark" ? "#5d6c79" : "#a9bcc9");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var txt = n.tier===0 ? "MYTHOS" : n.label;
      if(n.tier===0){ ctx.letterSpacing = "2px"; }
      ctx.fillText(txt.toUpperCase && n.tier<=1 ? txt.toUpperCase() : txt, p.x, p.y + R + (n.tier===0?32:15));
      ctx.restore();
    }
  }
  requestAnimationFrame(draw);
}

/* ---- hit testing ---- */
function pick(mx,my){
  var best=null, bd=1e9;
  nodes.forEach(function(n){
    if(!visible(n)) return;
    var p = toScreen(n);
    var d = Math.hypot(p.x-mx, p.y-my);
    var hit = Math.max(14, n.r*2.4*view.k);
    if(d < hit && d < bd){ bd=d; best=n; }
  });
  return best;
}

/* ---- panel ---- */
var panel = document.getElementById("panel");
var tip = document.getElementById("tip");
var nodeChoice = document.getElementById("node-choice");

// Derive keyboard access from the same visible nodes as the canvas. A separate
// hand-kept list would hide newly added capabilities from keyboard users.
function syncNodeChoices(){
  nodeChoice.replaceChildren(new Option("Select for evidence", ""));
  nodes.filter(visible).forEach(function(n){
    nodeChoice.add(new Option(n.label + " — " + C[n.s].label, n.id));
  });
  nodeChoice.value = selected && visible(selected) ? selected.id : "";
}
nodeChoice.addEventListener("change", function(){
  var n = nodes.find(function(n){ return n.id === nodeChoice.value && visible(n); });
  if(n){ open(n); document.getElementById("close").focus(); }
});

// Offscreen CSS leaves controls in the keyboard/accessibility tree. Keep both
// panels inert while closed; this is a non-modal detail view, not a focus trap.
function panelOpen(el, value){
  el.inert = !value;
  el.setAttribute("data-open", String(value));
}

function open(n){
  selected = n;
  nodeChoice.value = n.id;
  var d = n.data;
  document.getElementById("p-cluster").textContent = (d.cluster || "core").toUpperCase();
  document.getElementById("p-name").textContent = d.name || n.label;

  var v = document.getElementById("p-verdict");
  v.textContent = "Recorded: " + C[n.s].label;
  v.style.color = C[n.s].stroke;

  var m = document.getElementById("p-metric");
  var bar = document.getElementById("p-bar");
  if(typeof d.ok === "number" && typeof d.f === "number" && (!d.qualification || d.ok+d.f>0)){
    var tot = d.ok + d.f;
    var pct = tot ? Math.round(100*d.ok/tot) : 0;
    m.innerHTML =
      '<div><div class="v ok">'+d.ok+'</div><div class="k">ok</div></div>'+
      '<div><div class="v fail">'+d.f+'</div><div class="k">fail</div></div>'+
      '<div><div class="v">'+pct+'%</div><div class="k">success</div></div>';
    m.style.display = "flex";
    bar.style.display = "block";
    bar.firstElementChild.style.width = pct+"%";
    bar.firstElementChild.style.background = C[n.s].stroke;
    document.getElementById("p-scope").style.display = "";
  } else {
    m.style.display = "none";
    bar.style.display = "none";
    document.getElementById("p-scope").style.display = "none";
  }

  document.getElementById("p-note").textContent = d.note || "";
  if(d.qualification){
    var qLabels={available:"Available",verified:"Verified on this configuration",blocked:"Blocked",unsupported:"Unsupported"};
    document.getElementById("p-note").style.whiteSpace="pre-line";
    document.getElementById("p-note").textContent += "\n\n" + Object.keys(qLabels).map(function(k){return qLabels[k]+": "+d.qualification[k];}).join("\n");
  }
  var ev = document.getElementById("p-ev");
  ev.textContent = d.ev || "No narrative evidence is recorded for this capability.";

  var links = document.getElementById("p-links");
  links.innerHTML = "";
  var peers = [];
  if(n.tier === 0){ peers = CLUSTERS.map(function(c){return c.name;}); }
  else if(n.tier === 1){
    peers = nodes.filter(function(x){
      return x.tier===2 && edges.some(function(e){return e.a===n && e.b===x;});
    }).map(function(x){return x.label;});
  } else {
    var hub = edges.find(function(e){ return e.b===n; });
    peers = hub ? ["MYTHOS core", hub.a.label] : [];
  }
  peers.slice(0,14).forEach(function(p){
    var s = document.createElement("span"); s.textContent = p; links.appendChild(s);
  });
  document.getElementById("p-links-lbl").style.display = peers.length ? "" : "none";

  panelOpen(panel, true);
}
function close(){
  var restoreFocus = panel.contains(document.activeElement);
  panelOpen(panel, false); selected = null; nodeChoice.value = "";
  if(restoreFocus) nodeChoice.focus();
}
document.getElementById("close").addEventListener("click", close);
window.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });

/* ---- pointer ---- */
var drag = null;
cv.addEventListener("pointerdown", function(e){
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", function(e){
  if(drag){
    var dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy) > 4) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy;
    cv.style.cursor = "grabbing";
    return;
  }
  var n = pick(e.clientX, e.clientY);
  hover = n;
  cv.style.cursor = n ? "pointer" : "default";
  if(n && n.tier === 2){
    tip.setAttribute("data-on","true");
    var m = (typeof n.data.ok === "number") ? "  " + n.data.ok + " ok / " + n.data.f + " fail" : "";
    tip.innerHTML = "<b>" + n.label + "</b>" + m;
    tip.style.left = Math.min(window.innerWidth-tip.offsetWidth-12, e.clientX+14) + "px";
    tip.style.top  = (e.clientY - 34) + "px";
  } else tip.setAttribute("data-on","false");
});
cv.addEventListener("pointerup", function(e){
  var wasDrag = drag && drag.moved;
  drag = null; cv.style.cursor = "default";
  if(wasDrag) return;
  var n = pick(e.clientX, e.clientY);
  if(n) open(n); else close();
});
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  var f = e.deltaY < 0 ? 1.09 : 1/1.09;
  view.k = Math.max(0.34, Math.min(2.4, view.k*f));
}, {passive:false});

/* ---- legend ---- */
(function(){
  var host = document.getElementById("legend");
  var counts = {ok:0,warn:0,fail:0,dark:0,unknown:0};
  NODES.forEach(function(n){ counts[n.s]++; });
  ["ok","warn","fail","dark","unknown"].forEach(function(s){
    var b = document.createElement("button");
    b.className = "chip s-"+s;
    b.setAttribute("aria-pressed","true");
    b.innerHTML = '<span class="dot"></span>'+C[s].label+'<span class="ct">'+counts[s]+'</span>';
    b.addEventListener("click", function(){
      filter[s] = !filter[s];
      b.setAttribute("aria-pressed", String(filter[s]));
      if(selected && !filter[selected.s]) close();
      syncNodeChoices();
    });
    host.appendChild(b);
  });
})();

window.addEventListener("resize", function(){ resize(); });
/* The header is rendered from the island, so no number in it can be typed
   by hand. Each vital carries the stamp of WHEN and WHERE it was measured:
   the suite and tool counts come from the repository and are always current,
   while the incident backlog can only be read from the live vault, which a
   worktree and a CI runner cannot see. A vital nobody could measure renders
   dim with its last known stamp rather than as a confident zero. */
(function(){
  var sub = document.getElementById("hdr-sub");
  var v = DATA.vitals || {};
  sub.textContent = "generated " + (DATA.generated || "\u2014")
    + "  /  " + (v.registered ? v.registered.value : "?") + " registered"
    + "  /  " + (v.voiceReachable ? v.voiceReachable.value : "?") + " reachable by voice"
    + "  /  " + NODES.length + " nodes / recorded capability labels";
  var host = document.getElementById("hdr-vitals");
  ["tests","fail","untriaged","withheld"].forEach(function(k){
    var d = v[k]; if(!d) return;
    var el = document.createElement("div");
    el.className = "vital " + (d.stale ? "dim" : (d.tone || ""));
    var n = document.createElement("div"); n.className = "n"; n.textContent = d.value;
    var l = document.createElement("div"); l.className = "l"; l.textContent = d.label;
    el.appendChild(n); el.appendChild(l);
    if(d.measuredAt){
      var s = document.createElement("div"); s.className = "stamp";
      s.textContent = (d.stale ? "last read " : "") + d.measuredAt;
      el.appendChild(s);
    }
    host.appendChild(el);
  });
})();

/* ============================================================
   TICKET REGISTER — the second view over the same island.
   Data comes from DATA.register, written by build-index.js. Nothing here
   is hand-typed: the status words, the counts and the open set are all
   read. A ticket whose entry states no machine-readable status renders as
   "unrecorded" rather than being inferred closed — an entry with no status
   is not evidence of closure, and 133 of them say nothing at all.
   ============================================================ */
(function(){
  var REG = (DATA.register) || {bugs:[], counts:{}, total:0, openDeclared:[], pointerOnly:0};
  var TONE = {
    verified:  {c:"#3ddc97", bg:"rgba(61,220,151,.12)",  label:"verified"},
    fixed:     {c:"#66d9c0", bg:"rgba(102,217,192,.10)", label:"fixed"},
    open:      {c:"#ff5a61", bg:"rgba(255,90,97,.12)",   label:"open"},
    coded:     {c:"#f2b23c", bg:"rgba(242,178,60,.12)",  label:"coded"},
    diagnosed: {c:"#f2b23c", bg:"rgba(242,178,60,.12)",  label:"diagnosed"},
    duplicate: {c:"#7d909c", bg:"rgba(125,144,156,.12)", label:"duplicate"},
    unrecorded:{c:"#8a7cf0", bg:"rgba(138,124,240,.12)", label:"unrecorded"}
  };
  var ORDER = ["open","coded","diagnosed","unrecorded","fixed","verified","duplicate"];
  var on = {}; ORDER.forEach(function(k){ on[k] = true; });
  var q = "";

  var note = document.getElementById("reg-note");
  note.innerHTML = "";
  var b1 = document.createElement("b");
  b1.textContent = REG.total + " declared ticket numbers, " + (REG.counts.unrecorded || 0) + " with no recorded status.";
  note.appendChild(b1);
  note.appendChild(document.createTextNode(
    " Status comes from each ticket's recorded evidence and the OPEN WORK register; " +
    "absence of a status is not evidence of closure. " + REG.pointerOnly + " tickets exist only as " +
    "bullets without their own headings. Historical verification is not a fresh campaign result."));

  var filters = document.getElementById("reg-filters");
  ORDER.forEach(function(k){
    var n = REG.counts[k] || 0;
    var btn = document.createElement("button");
    btn.className = "fchip"; btn.type = "button"; btn.setAttribute("aria-pressed","true");
    btn.style.color = TONE[k].c; btn.style.borderColor = TONE[k].c;
    var sw = document.createElement("span"); sw.className = "sw"; sw.style.background = TONE[k].c;
    var tx = document.createElement("span"); tx.textContent = TONE[k].label;
    var ct = document.createElement("span"); ct.className = "ct"; ct.textContent = n;
    btn.appendChild(sw); btn.appendChild(tx); btn.appendChild(ct);
    btn.addEventListener("click", function(){
      on[k] = !on[k]; btn.setAttribute("aria-pressed", String(on[k])); draw();
    });
    filters.appendChild(btn);
  });

  var search = document.getElementById("reg-search");
  search.addEventListener("input", function(){ q = search.value.trim().toLowerCase(); draw(); });

  var groupsEl = document.getElementById("reg-groups");
  var empty = document.getElementById("reg-empty");

  /* One line per group explaining what the state MEANS, because "unrecorded"
     and "fixed" are not self-evident and the difference is the whole point. */
  var GNOTE = {
    open:       "recorded as open or partially complete",
    coded:      "written, not yet proven",
    diagnosed:  "root cause known, fix undecided",
    unrecorded: "the entry states no status \u2014 not evidence of closure",
    fixed:      "says fixed; verification not stated",
    verified:   "fixed AND live-verified or mutation-proven",
    duplicate:  "closed as a duplicate of another ticket"
  };

  function draw(){
    var rows = REG.bugs.filter(function(b){
      if(!on[b.state]) return false;
      if(!q) return true;
      // Match the ID we display, including zero-padded IDs copied from BUGS.md.
      // Anchor the prefix: a partial ID must not select a different ticket.
      var ticketId = /^bug-0*(\d+)$/.exec(q);
      if(ticketId) return Number(ticketId[1]) === b.n;
      return String(b.n).indexOf(q) !== -1 || (b.title || "").toLowerCase().indexOf(q) !== -1;
    });
    groupsEl.textContent = "";
    var shown = 0;

    ORDER.forEach(function(state){
      var inGroup = rows.filter(function(b){ return b.state === state; })
                        .sort(function(a,b){ return b.n - a.n; });
      if(!inGroup.length) return;
      shown += inGroup.length;

      var g = document.createElement("div"); g.className = "reg-group";
      var head = document.createElement("div"); head.className = "reg-ghead";
      var gd = document.createElement("span"); gd.className = "reg-gdot";
      gd.style.background = TONE[state].c;
      var gn = document.createElement("span"); gn.className = "reg-gname";
      gn.textContent = TONE[state].label;
      var gc = document.createElement("span"); gc.className = "reg-gcount";
      gc.textContent = inGroup.length;
      var gnote = document.createElement("span"); gnote.className = "reg-gnote";
      gnote.textContent = GNOTE[state] || "";
      head.appendChild(gd); head.appendChild(gn); head.appendChild(gc); head.appendChild(gnote);
      g.appendChild(head);

      inGroup.forEach(function(b){
        var r = document.createElement("div"); r.className = "reg-row";
        var d = document.createElement("span"); d.className = "reg-dot";
        d.style.background = TONE[b.state].c;
        var k = document.createElement("span"); k.className = "reg-key";
        k.textContent = "BUG-" + b.n;
        var nm = document.createElement("span"); nm.className = "reg-name";
        nm.textContent = b.title || "\u2014";
        nm.title = b.title || "";
        var tags = document.createElement("span"); tags.className = "reg-tags";
        /* Which capability node carries this ticket, when another generator
           has attached it. Absent until that field lands; absence is not an
           error, so nothing is rendered for it. */
        (nodesFor(b.n) || []).forEach(function(nodeName){
          var t = document.createElement("span"); t.className = "reg-tag node";
          t.textContent = nodeName; tags.appendChild(t);
        });
        if(b.shape === "pointer"){
          var t2 = document.createElement("span"); t2.className = "reg-tag";
          t2.textContent = "bullet only"; tags.appendChild(t2);
        }
        r.appendChild(d); r.appendChild(k); r.appendChild(nm); r.appendChild(tags);
        r.tabIndex = 0; r.setAttribute("role", "button");
        r.setAttribute("aria-label", "BUG-" + b.n + ": " + (b.title || ""));
        r.addEventListener("click", function(){ openTicket(b, r); });
        r.addEventListener("keydown", function(ev){
          if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openTicket(b, r); }
        });
        g.appendChild(r);
      });
      groupsEl.appendChild(g);
    });
    empty.hidden = shown > 0;
  }

  /* Reverse index from the per-node `bugs` field, owned by the map generator.
     Built defensively: the field is optional and may not exist yet. */
  function nodesFor(n){
    if(!nodesFor._i){
      var idx = {};
      (DATA.nodes || []).forEach(function(nd){
        (nd.bugs || []).forEach(function(bn){ (idx[bn] = idx[bn] || []).push(nd.n); });
      });
      nodesFor._i = idx;
    }
    return nodesFor._i[n];
  }

  /* ---- ticket detail ------------------------------------------------
     Sections come from build-index.js, which extracts the bold labels the
     entries actually use (symptom 69, cause 63, fix 64, verification 69).
     107 of 226 entries carry none of them and fall back to an excerpt, so
     the panel always says something rather than opening blank — but it also
     always names the source, because every section is capped and BUGS.md
     stays the place to read the whole thing. */
  var SECS = [
    ["symptom",      "What went wrong"],
    ["cause",        "Root cause"],
    ["fix",          "The fix"],
    ["verification", "How it was verified"],
    ["limits",       "What this does NOT cover"],
    ["files",        "Files"]
  ];
  var tpanel = document.getElementById("tpanel");
  var selectedRow = null;

  function openTicket(b, row){
    if(selectedRow) selectedRow.removeAttribute("aria-current");
    selectedRow = row; row.setAttribute("aria-current", "true");

    document.getElementById("t-key").textContent = "BUG-" + b.n;
    document.getElementById("t-title").textContent = b.title || "\u2014";
    var v = document.getElementById("t-state");
    v.textContent = TONE[b.state].label + " \u00b7 " + (GNOTE[b.state] || "");
    v.style.color = TONE[b.state].c;

    var meta = document.getElementById("t-meta");
    meta.textContent = "";
    var bits = [];
    (nodesFor(b.n) || []).forEach(function(nn){ bits.push(["node", nn]); });
    bits.push(["entry", b.shape === "pointer" ? "bullet only, no heading" : "full entry"]);
    bits.forEach(function(pair){
      var t = document.createElement("span");
      t.className = "reg-tag" + (pair[0] === "node" ? " node" : "");
      t.textContent = pair[1]; meta.appendChild(t);
    });

    var body = document.getElementById("t-body");
    body.textContent = "";
    if(b.campaign){
      var campaignWrap = document.createElement("div"); campaignWrap.className = "tp-sec";
      var campaignLabel = document.createElement("div"); campaignLabel.className = "lbl";
      campaignLabel.textContent = "Campaign assessment";
      campaignWrap.appendChild(campaignLabel);
      [b.campaign.disposition, b.campaign.evidence, b.campaign.source].forEach(function(text){
        var paragraph = document.createElement("p"); paragraph.textContent = text;
        campaignWrap.appendChild(paragraph);
      });
      body.appendChild(campaignWrap);
    }
    var det = b.detail || {};
    var any = false;
    SECS.forEach(function(pair){
      var txt = det[pair[0]];
      if(!txt) return;
      any = true;
      var wrap = document.createElement("div"); wrap.className = "tp-sec";
      var lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = pair[1];
      var p = document.createElement("p"); p.textContent = txt;
      wrap.appendChild(lbl); wrap.appendChild(p); body.appendChild(wrap);
    });
    if(!any){
      var wrap2 = document.createElement("div"); wrap2.className = "tp-sec";
      var l2 = document.createElement("div"); l2.className = "lbl";
      l2.textContent = "Entry (no labelled sections)";
      var p2 = document.createElement("p");
      p2.textContent = b.excerpt || "This ticket has no written entry beyond its title.";
      wrap2.appendChild(l2); wrap2.appendChild(p2); body.appendChild(wrap2);
    }

    document.getElementById("t-src").textContent =
      "Read in full: BUGS.md, search \u201cBUG-" + b.n + "\u201d. Sections here are extracted " +
      "and capped at 900 characters \u2014 this view is for triage, the file is the source.";

    panelOpen(tpanel, true);
    document.getElementById("tclose").focus();
  }

  function closeTicket(){
    var restoreFocus = tpanel.contains(document.activeElement);
    panelOpen(tpanel, false);
    if(restoreFocus && selectedRow && selectedRow.isConnected) selectedRow.focus();
    if(selectedRow){ selectedRow.removeAttribute("aria-current"); selectedRow = null; }
  }
  document.getElementById("tclose").addEventListener("click", closeTicket);
  window.addEventListener("keydown", function(e){ if(e.key === "Escape") closeTicket(); });

  draw();

  /* ---- view switcher ---- */
  var tabMap = document.getElementById("tab-map");
  var tabReg = document.getElementById("tab-reg");
  var reg = document.getElementById("register");
  var chrome = ["legend","hint","panel","tip"].map(function(id){ return document.getElementById(id); });

  function show(which){
    var isReg = which === "register";
    reg.hidden = !isReg;
    tabReg.setAttribute("aria-selected", String(isReg));
    tabMap.setAttribute("aria-selected", String(!isReg));
    cv.style.visibility = isReg ? "hidden" : "";
    chrome.forEach(function(el){ if(el) el.style.display = isReg ? "none" : ""; });
    if(!isReg) closeTicket();
    if(!isReg) resize();
  }
  tabMap.addEventListener("click", function(){ show("map"); });
  tabReg.addEventListener("click", function(){ show("register"); });
})();

build(); syncNodeChoices(); place(); resize();
/* one more measure after first layout, for hosts that report 0 on first paint */
requestAnimationFrame(function(){ resize(); });
window.addEventListener("load", function(){ resize(); });
requestAnimationFrame(draw);
</script>
</body>
</html>
